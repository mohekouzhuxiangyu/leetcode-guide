<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>力扣算法学习助手 · LeetCode Agent</title>
  <link rel="stylesheet" href="/assets/vendor/github-dark.min.css" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-icon">🧠</span>
      <div>
        <div class="brand-name">力扣算法学习助手</div>
        <div class="brand-sub">LangChain × DeepSeek Agent</div>
      </div>
    </div>

    <button id="btn-new" class="btn btn-primary btn-block">＋ 新建题目</button>

    <div class="history-title">📚 历史记录</div>
    <ul id="history-list" class="history-list">
      <li class="history-empty">暂无记录</li>
    </ul>
  </aside>

  <main id="main">
    <!-- 输入区 -->
    <section id="input-panel" class="panel">
      <h1>输入力扣题目链接</h1>
      <p class="subtitle">粘贴 Hot 100 任意一题的链接，Agent 自动生成算法解析、流程图与多语言代码</p>
      <div class="input-row">
        <input id="url-input" type="text" spellcheck="false"
               placeholder="https://leetcode.cn/problems/two-sum/ 或 https://leetcode.com/problems/..." />
        <button id="btn-generate" class="btn btn-primary">⚡ 生成解析</button>
      </div>
      <p class="hint">支持 leetcode.com 与 leetcode.cn 链接；示例：
        <span class="example" data-url="https://leetcode.cn/problems/two-sum/">两数之和</span> ·
        <span class="example" data-url="https://leetcode.com/problems/longest-substring-without-repeating-characters/">无重复字符的最长子串</span> ·
        <span class="example" data-url="https://leetcode.cn/problems/merge-two-sorted-lists/">合并两个有序链表</span>
      </p>
    </section>

    <!-- 进度区 -->
    <section id="progress-panel" class="panel hidden">
      <h2>⏳ Agent 工作流执行中</h2>
      <ol id="progress-steps" class="progress-steps">
        <li data-stage="fetch">📥 抓取题目信息</li>
        <li data-stage="translate">🌐 翻译中文题目</li>
        <li data-stage="analyze">📝 算法分析</li>
        <li data-stage="flowchart">🔄 生成流程图</li>
        <li data-stage="code">💻 生成代码</li>
        <li data-stage="done">💾 保存记录</li>
      </ol>
      <div id="progress-msg" class="progress-msg"></div>
      <div class="progress-spinner"></div>
    </section>

    <!-- 错误区 -->
    <section id="error-panel" class="panel error-panel hidden"></section>

    <!-- 结果区 -->
    <section id="result-panel" class="panel hidden">
      <div class="result-header">
        <div class="result-title-row">
          <h2 id="result-title"></h2>
          <span id="result-difficulty" class="badge"></span>
        </div>
        <div id="result-tags" class="tag-row"></div>
        <div class="result-meta">
          <a id="result-link" href="#" target="_blank" rel="noopener">查看原题 ↗</a>
          <span id="result-time"></span>
          <button id="btn-regen" class="btn btn-small">🔄 重新生成</button>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="problem">📋 题目信息</button>
        <button class="tab" data-tab="analysis">📝 算法解析</button>
        <button class="tab" data-tab="flowchart">🔄 流程图</button>
        <button class="tab" data-tab="code">💻 代码</button>
      </div>

      <div class="tab-content" id="tab-problem"></div>
      <div class="tab-content hidden" id="tab-analysis"></div>
      <div class="tab-content hidden" id="tab-flowchart">
        <div class="mermaid-toolbar">
          <button id="btn-mermaid-copy" class="btn btn-small">📋 复制 Mermaid 源码</button>
        </div>
        <div id="mermaid-container" class="mermaid-container"></div>
        <details class="mermaid-source">
          <summary>查看 Mermaid 源码</summary>
          <pre id="mermaid-source-pre"></pre>
        </details>
      </div>
      <div class="tab-content hidden" id="tab-code">
        <div id="code-langs" class="code-langs"></div>
        <div id="code-container"></div>
      </div>
    </section>
  </main>

  <!-- 本地托管的第三方库（避免 CDN 不可达导致页面报错） -->
  <script src="/assets/vendor/mermaid.min.js"></script>
  <script src="/assets/vendor/marked.min.js"></script>
  <script src="/assets/vendor/highlight.min.js"></script>
  <script src="/assets/vendor/python.min.js"></script>
  <script src="/assets/vendor/java.min.js"></script>
  <script src="/assets/vendor/cpp.min.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
